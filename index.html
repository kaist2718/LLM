<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qwen3.5-9B — 로컬 채팅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b6eff'/%3E%3Ctext x='32' y='44' font-size='38' text-anchor='middle'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  /* -- design tokens (v2) -- */
  :root {
    --bg: #0b0d12; --bg-soft: #12141c; --bg-raised: #1a1d28;
    --bg-user: #4f6ef7; --bg-user-hover: #6480ff;
    --fg: #eceef4; --fg-dim: #9aa2b2; --fg-muted: #656d7e;
    --accent: #6c8aff; --accent-dim: rgba(108,138,255,0.14);
    --accent-2: #8b6cff;
    --border: rgba(255,255,255,0.08); --border-light: rgba(255,255,255,0.13);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35); --shadow-md: 0 8px 28px rgba(0,0,0,0.38);
    --radius-sm: 10px; --radius: 14px; --radius-lg: 20px; --radius-xl: 26px;
    --font-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, SFMono-Regular, monospace;
    --sidebar-w: 272px;
    --content-max: 860px;   /* 채팅 본문 최대 너비 */
    --reading-fs: 16px;     /* 답변 기본 글자 크기 */
  }
  [data-theme="light"] {
    --bg: #f7f7f9; --bg-soft: #ffffff; --bg-raised: #ffffff;
    --bg-user: #3355f1; --bg-user-hover: #4766ff;
    --fg: #16181f; --fg-dim: #5b6270; --fg-muted: #9aa1ae;
    --accent: #3355f1; --accent-dim: rgba(51,85,241,0.09);
    --accent-2: #7c5cff;
    --border: rgba(22,24,31,0.09); --border-light: rgba(22,24,31,0.14);
    --shadow-sm: 0 1px 2px rgba(20,24,40,0.05); --shadow-md: 0 10px 30px rgba(20,24,40,0.1);
  }

  /* -- reset & base -- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column;
    transition: background 0.35s, color 0.35s;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }
  ::selection { background: var(--accent-dim); }

  /* -- header -- */
  header {
    padding: 0 20px; height: 56px; min-height: 56px;
    background: var(--bg-soft); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow-sm); z-index: 30; transition: background 0.35s; flex-shrink: 0;
    backdrop-filter: blur(12px);
  }
  header .title {
    font-weight: 800; font-size: 16px; white-space: nowrap; letter-spacing: -0.3px;
    display: flex; align-items: center; gap: 10px;
  }
  header .title small { font-weight: 500; font-size: 11px; color: var(--fg-dim); background: var(--bg); padding: 3px 10px; border-radius: 999px; }
  .controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .ctl { display: flex; flex-direction: column; gap: 1px; font-size: 10px; color: var(--fg-dim); }
  .temp-ctl { min-width: 160px; }
  .temp-track-wrap { position: relative; }
  .temp-track-wrap input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); height: 4px; }
  .temp-marks { display: flex; justify-content: space-between; font-size: 9px; color: var(--fg-muted); margin-top: 1px; }
  .temp-marks span { flex: 1; text-align: center; }

  /* -- buttons -- */
  button {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 8px 16px; font-weight: 700; cursor: pointer; font-size: 13px; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: all 0.15s; white-space: nowrap;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--fg-dim); border: 1px solid var(--border); font-weight: 600; }
  button.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); filter: none; }
  button.danger { background: #e05560; }
  button.small { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
  button.icon-btn { padding: 6px 9px; font-size: 16px; line-height: 1; }
  #menuBtn { display: none; }

  .loading-badge { display: none; font-size: 11px; color: #e0a020; align-items: center; gap: 6px; font-weight: 600; }
  .loading-badge.active { display: inline-flex; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  .spinner.active { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* -- app shell -- */
  .app-shell { flex: 1; min-height: 0; display: flex; }

  /* -- sidebar -- */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-soft);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: transform 0.25s ease, background 0.35s;
  }
  .sidebar-head { padding: 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
  #newChatBtn { width: 100%; }
  #convSearch {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; font-family: inherit; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #convSearch:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .conv-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .conv-list > * { flex-shrink: 0; }
  .conv-item {
    display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; position: relative; transition: background 0.15s;
  }
  .conv-item:hover { background: var(--bg-raised); }
  .conv-item.active { background: var(--accent-dim); }
  .conv-item.active .conv-title { color: var(--accent); }
  .conv-ava {
    width: 30px; height: 30px; border-radius: 8px; background: var(--bg-raised);
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .conv-body { flex: 1; min-width: 0; }
  .conv-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-sub { font-size: 11px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv-acts { display: none; gap: 2px; flex-shrink: 0; }
  .conv-item:hover .conv-acts, .conv-item.active .conv-acts { display: flex; }
  .conv-act { background: transparent; color: var(--fg-dim); padding: 4px 6px; font-size: 13px; border: none; line-height: 1; }
  .conv-act:hover { color: var(--accent); filter: none; }
  .conv-rename {
    flex: 1; min-width: 0; background: var(--bg); color: var(--fg); border: 1px solid var(--accent);
    border-radius: 6px; padding: 3px 7px; font-size: 13px; font-family: inherit; outline: none;
  }
  .conv-empty { font-size: 12px; color: var(--fg-muted); text-align: center; padding: 28px 8px; line-height: 1.8; }
  .sidebar-foot { padding: 12px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--fg-dim); }
  .sidebar-foot label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #maxTokensSel, #personaSel {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 8px; font-size: 12px; font-family: inherit; outline: none; cursor: pointer;
    max-width: 150px;
  }
  .sidebar-tip { margin-top: 10px; font-size: 11px; color: var(--fg-muted); line-height: 1.7; }
  .sidebar-backdrop { display: none; }

  /* -- main column -- */
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }

  /* -- chat container -- */
  #messages {
    flex: 1; min-height: 0; overflow-y: auto; padding: 28px 0 16px;
    display: flex; flex-direction: column; gap: 16px;
  }
  /* 스크롤되는 flex 컨테이너에서 메시지가 줄어들며 잘리는 현상 방지 */
  #messages > * { flex-shrink: 0; }
  .msg-wrapper { max-width: var(--content-max); width: 100%; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 6px; }
  @media (max-width: 980px) { .msg-wrapper { max-width: 100%; padding: 0 18px; } }
  @media (max-width: 480px) { .msg-wrapper { padding: 0 12px; } }

  /* -- intro card -- */
  .intro-card {
    text-align: center; padding: 60px 32px; max-width: 600px; margin: auto;
    animation: fadeInUp 0.5s ease;
  }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .intro-card .quote-icon { font-size: 56px; margin-bottom: 20px; display: block; }
  .intro-card .quote-text { font-size: 22px; font-weight: 800; line-height: 1.7; color: var(--fg); margin-bottom: 10px; letter-spacing: -0.3px; }
  .intro-card .quote-author { font-size: 13px; color: var(--fg-dim); margin-bottom: 32px; font-weight: 500; }
  .intro-card .guide { font-size: 13px; color: var(--fg-dim); line-height: 2; }
  .intro-card .guide b { color: var(--accent); font-weight: 700; background: var(--accent-dim); padding: 1px 6px; border-radius: 4px; }
  .row.bot { animation: fadeInUp 0.35s ease; }
  .row.user { animation: fadeInUp 0.25s ease; }

  /* -- message rows -- */
  .row { display: flex; gap: 12px; align-items: flex-start; width: 100%; }
  .row.user { justify-content: flex-end; }
  .avatar {
    width: 36px; height: 36px; border-radius: var(--radius-sm); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: var(--bg-raised); border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .row.user .avatar { order: 2; }

  /* -- bubbles -- */
  .msg {
    max-width: 90%; padding: 16px 22px; border-radius: var(--radius-lg); line-height: 1.8; font-size: var(--reading-fs);
    word-break: break-word; overflow-wrap: anywhere; position: relative;
  }
  .msg.user {
    background: var(--bg-user); color: #fff;
    border-bottom-right-radius: var(--radius-sm); margin-left: auto;
    font-size: 15.5px; font-weight: 500;
  }
  .msg.bot {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-bottom-left-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm);
  }
  .msg .meta {
    font-size: 11px; color: var(--fg-dim); margin-bottom: 8px;
    display: flex; gap: 10px; align-items: center; font-weight: 500;
  }
  .row.user .msg .meta { color: rgba(255,255,255,0.6); justify-content: flex-end; }

  .msg .btext { white-space: pre-wrap; }
  .msg .btext.md { white-space: normal; }
  .msg .btext.md p { margin: 0 0 12px; }
  .msg .btext.md p:last-child { margin: 0; }
  .msg .btext.md h1,.msg .btext.md h2,.msg .btext.md h3,.msg .btext.md h4 { margin: 20px 0 10px; font-weight: 700; line-height: 1.4; }
  .msg .btext.md h1 { font-size: 1.35em; } .msg .btext.md h2 { font-size: 1.18em; } .msg .btext.md h3 { font-size: 1.06em; }
  .msg .btext.md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .msg .btext.md a:hover { filter: brightness(1.15); }
  .msg .btext.md code {
    background: var(--bg); padding: 2px 7px; border-radius: 5px;
    font-family: var(--font-mono); font-size: 0.9em; font-weight: 500;
  }
  .row.user .msg .btext.md code { background: rgba(255,255,255,0.18); }
  .msg .btext.md pre {
    background: var(--bg); padding: 16px 18px 16px 18px; border-radius: 12px; overflow: auto; margin: 14px 0;
    border: 1px solid var(--border); position: relative;
  }
  .msg .btext.md pre code { background: none; padding: 0; border: none; font-size: 13.5px; line-height: 1.65; }
  .code-lang {
    position: absolute; top: 8px; left: 12px; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--fg-muted); font-family: var(--font-mono); pointer-events: none;
  }
  .code-copy {
    position: absolute; top: 8px; right: 8px; padding: 3px 9px; font-size: 11px; z-index: 2;
    background: var(--bg-raised); color: var(--fg-dim); border: 1px solid var(--border); opacity: 0.85;
  }
  .code-copy:hover { color: var(--accent); border-color: var(--accent); opacity: 1; filter: none; }
  .msg .btext.md ul, .msg .btext.md ol { margin: 10px 0; padding-left: 26px; }
  .msg .btext.md li { margin: 5px 0; line-height: 1.7; }
  .msg .btext.md blockquote {
    border-left: 3px solid var(--accent); margin: 12px 0; padding: 6px 0 6px 16px;
    color: var(--fg-dim); font-style: italic; background: var(--accent-dim); border-radius: 0 8px 8px 0;
  }
  .msg .btext.md table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  .msg .btext.md .table-wrap { overflow-x: auto; margin: 12px 0; }
  .msg .btext.md .table-wrap table { margin: 0; }
  .msg .btext.md th, .msg .btext.md td { border: 1px solid var(--border); padding: 9px 13px; text-align: left; }
  .msg .btext.md th { background: var(--bg); font-weight: 700; }
  .msg .btext.md tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  .msg .btext.md hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

  .cursor::after { content: "\258d"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .metrics { margin-top: 8px; font-size: 11px; color: var(--fg-dim); display: flex; gap: 10px; flex-wrap: wrap; }
  .metrics b { color: var(--accent); font-weight: 700; }

  .edit-area {
    width: 100%; background: var(--bg); color: var(--fg); border: 2px solid var(--accent);
    border-radius: var(--radius-sm); padding: 10px 14px; font-family: inherit; font-size: 15px;
    resize: vertical; min-height: 44px; line-height: 1.6;
  }

  /* -- chips -- */
  #chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 8px 0 20px; }
  .chip {
    background: var(--bg-raised); color: var(--fg); border: 1px solid var(--border);
    border-radius: 999px; padding: 9px 18px; font-size: 13px; cursor: pointer; font-weight: 600;
    transition: all 0.2s; box-shadow: var(--shadow-sm);
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-dim); transform: translateY(-1px); box-shadow: var(--shadow-md); }

  /* -- footer -- */
  footer {
    border-top: 1px solid var(--border); background: var(--bg-soft);
    padding: 12px 24px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    transition: background 0.35s; flex-shrink: 0;
  }
  @media (max-width: 640px) { footer { padding: 10px 14px 14px; gap: 8px; } }
  #input {
    flex: 1; background: var(--bg-raised); border: 1.5px solid var(--border);
    border-radius: var(--radius); color: var(--fg); padding: 16px 18px;
    font-size: 15.5px; font-family: inherit; resize: none; max-height: 220px;
    line-height: 1.65; box-shadow: var(--shadow-sm);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #input:hover { border-color: var(--border-light); }
  #input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .send-col { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; justify-content: flex-end; }
  .char-count { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .char-count.warn { color: #e0a020; font-weight: 700; }
  #sendBtn { padding: 14px 24px; border-radius: var(--radius); font-size: 14px; }
  @media (max-width: 640px) { #sendBtn { padding: 12px 18px; } }

  /* -- 문서 첨부 (PDF/엑셀) -- */
  #attachBtn { font-size: 18px; padding: 8px 10px; }
  #attachBtn.active { color: var(--accent); }
  .attach-row { flex: 0 0 100%; display: flex; gap: 8px; flex-wrap: wrap; }
  .attach-row[hidden] { display: none; }
  .attach-thumb { position: relative; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border); background: var(--bg-raised); }
  .attach-thumb .rm { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; border: none; font-size: 13px; line-height: 1; cursor: pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .attach-thumb .rm:hover { background: rgba(0,0,0,.85); }

  /* -- scroll-to-bottom button -- */
  #scrollBtn {
    position: absolute; right: 24px; bottom: 96px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg-raised); border: 1px solid var(--border); color: var(--fg);
    box-shadow: var(--shadow-md); display: none; align-items: center; justify-content: center;
    font-size: 18px; padding: 0; z-index: 20; cursor: pointer;
  }
  #scrollBtn.show { display: inline-flex; animation: fadeInUp 0.2s ease; }
  #scrollBtn:hover { border-color: var(--accent); color: var(--accent); filter: none; }
  @media (max-width: 640px) { #scrollBtn { right: 14px; bottom: 90px; } }

  /* -- toast -- */
  .model-toast {
    position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: #fff; padding: 10px 24px; border-radius: 999px;
    font-size: 13px; font-weight: 700; z-index: 100; opacity: 0;
    transition: opacity 0.3s, transform 0.3s; pointer-events: none; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .model-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* -- responsive -- */
  @media (max-width: 880px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 60;
      transform: translateX(-100%); box-shadow: var(--shadow-md);
    }
    body.sidebar-open .sidebar { transform: translateX(0); }
    body.sidebar-open .sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 55; }
    #menuBtn { display: inline-flex; }
  }
  @media (max-width: 768px) {
    header { padding: 0 14px; height: auto; min-height: 50px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
    .temp-ctl { min-width: 120px; }
    .msg { max-width: 88%; }
  }
  @media (max-width: 480px) {
    header { padding: 8px 10px; gap: 8px; }
    header .title { font-size: 13px; }
    .controls { gap: 4px; }
    .temp-ctl { display: none; }
    .msg { max-width: 94%; padding: 12px 16px; font-size: 14px; }
    button { font-size: 12px; padding: 6px 12px; }
    #input { font-size: 14px; padding: 12px 14px; }
    #sendBtn { padding: 12px 16px; }
    .intro-card { padding: 40px 20px; }
    .intro-card .quote-text { font-size: 18px; }
  }

  /* ============================================================
     고도화 추가 스타일
     ============================================================ */

  /* -- 드래그&드롭 오버레이 -- */
  #dropOverlay {
    position: fixed; inset: 0; z-index: 200; display: none;
    align-items: center; justify-content: center;
    background: rgba(59,110,255,0.16); backdrop-filter: blur(2px);
    pointer-events: none;
  }
  #dropOverlay.show { display: flex; }
  #dropOverlay .drop-card {
    border: 2.5px dashed var(--accent); border-radius: var(--radius-xl);
    background: var(--bg-raised); padding: 40px 56px; text-align: center;
    box-shadow: var(--shadow-md); color: var(--fg);
  }
  #dropOverlay .drop-card .drop-emoji { font-size: 48px; display: block; margin-bottom: 10px; }
  #dropOverlay .drop-card .drop-title { font-size: 18px; font-weight: 800; }
  #dropOverlay .drop-card .drop-sub { font-size: 13px; color: var(--fg-dim); margin-top: 6px; }

  /* -- 상단 검색/바 (대화내 검색) -- */
  #searchBar {
    display: none; flex-shrink: 0; padding: 10px 24px; gap: 8px; align-items: center;
    background: var(--bg-soft); border-bottom: 1px solid var(--border);
  }
  #searchBar.open { display: flex; animation: fadeInUp 0.2s ease; }
  #searchInput {
    flex: 1; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 16px; font-size: 13px; font-family: inherit; color: var(--fg); outline: none;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  #searchCount { font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .search-btns { display: flex; gap: 4px; }
  .search-btns button { padding: 5px 10px; font-size: 12px; }
  mark.search-hit { background: rgba(224,160,32,0.4); color: inherit; border-radius: 3px; padding: 0 2px; }
  mark.search-hit.active { background: var(--accent); color: #fff; }

  /* -- 메시지 호버 액션바 -- */
  .msg-actions {
    position: absolute; top: -14px; right: 10px; display: none; gap: 2px;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
    padding: 2px; box-shadow: var(--shadow-md); z-index: 5;
  }
  .row.user .msg-actions { right: auto; left: 10px; }
  .msg-wrap:hover .msg-actions, .msg-actions:focus-within { display: flex; }
  .msg-action-btn {
    background: transparent; color: var(--fg-dim); border: none; padding: 4px 7px;
    font-size: 13px; border-radius: 6px; cursor: pointer; line-height: 1;
  }
  .msg-action-btn:hover { background: var(--bg-raised); color: var(--accent); filter: none; }
  .msg-action-btn.active-fav { color: #e0a020; }
  .msg { position: relative; }

  /* -- 즐겨찾기(★) 패널 -- */
  #favPanel {
    display: none; flex-direction: column; border-bottom: 1px solid var(--border);
    background: var(--bg-soft); max-height: 40vh; overflow-y: auto;
  }
  #favPanel.open { display: flex; animation: fadeInUp 0.2s ease; }
  #favPanel .fav-head { padding: 12px 24px 6px; font-size: 13px; font-weight: 800; color: var(--accent); display: flex; align-items: center; justify-content: space-between; }
  #favPanel .fav-empty { padding: 8px 24px 16px; font-size: 12px; color: var(--fg-muted); }
  .fav-item { padding: 9px 24px; border-top: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .fav-item:hover { background: var(--bg-raised); }
  .fav-item .fav-meta { font-size: 11px; color: var(--fg-dim); margin-bottom: 3px; display: flex; gap: 8px; align-items: center; }
  .fav-item .fav-text { font-size: 13px; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* -- 단축키 도움말 모달 -- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 150;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; animation: fadeInUp 0.2s ease; }
  .modal-card {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius-lg);
    max-width: 460px; width: 100%; box-shadow: var(--shadow-md); overflow: hidden;
  }
  .modal-card .m-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-card .m-head h3 { font-size: 15px; font-weight: 800; }
  .modal-card .m-body { padding: 12px 20px 18px; }
  .shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .shortcut-row:last-child { border-bottom: none; }
  .shortcut-row .keys { display: flex; gap: 4px; }
  .kbd { background: var(--bg); border: 1px solid var(--border-light); border-bottom-width: 2px; border-radius: 5px; padding: 2px 7px; font-size: 11px; font-family: var(--font-mono); color: var(--fg-dim); }

  /* -- 사이드바: 고정/섹션 -- */
  .conv-section-label { font-size: 10px; color: var(--fg-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 10px 4px; }
  .conv-item.pinned .conv-title::before { content: "📌 "; }
  .conv-pin {
    background: transparent; color: var(--fg-muted); border: none; padding: 4px 6px; font-size: 12px; line-height: 1; cursor: pointer; border-radius: 5px;
  }
  .conv-pin:hover { color: var(--accent); filter: none; }
  .conv-pin.active { color: #e0a020; }

  /* -- 팝업 (내보내기 등) -- */
  .regen-model-pop {
    position: absolute; bottom: 100%; margin-bottom: 6px; right: 0; left: auto;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow-md); padding: 5px; min-width: 200px; z-index: 10; display: none;
  }
  .regen-model-pop.open { display: block; }
  .regen-model-pop button {
    width: 100%; justify-content: flex-start; background: transparent; color: var(--fg);
    border: none; padding: 8px 10px; font-weight: 600; font-size: 13px; border-radius: 7px;
  }
  .regen-model-pop button:hover { background: var(--bg-raised); color: var(--accent); filter: none; }

  /* -- 더 보기(과거 메시지) 센티넬 -- */
  .load-older {
    text-align: center; padding: 12px; margin: 0 auto; max-width: var(--content-max);
  }
  .load-older button { font-size: 12px; }

  @media (max-width: 480px) {
    #searchBar { padding: 8px 12px; }
    #favPanel .fav-head, #favPanel .fav-item, #favPanel .fav-empty { padding-left: 14px; padding-right: 14px; }
  }

  /* ============================================================
     v2 — 상용 LLM 스타일 UI (아래 규칙이 위 규칙을 덮어씀)
     ============================================================ */
  html { scroll-behavior: smooth; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  body { letter-spacing: -0.01em; }

  /* -- 헤더 (글래스 바 + 브랜드) -- */
  header {
    height: 60px; min-height: 60px; padding: 0 18px; gap: 12px; position: relative;
    background: var(--bg-soft);
    background: color-mix(in srgb, var(--bg-soft) 80%, transparent);
    backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
    border-bottom: 1px solid var(--border); box-shadow: none;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 16px rgba(80,110,255,0.35);
  }
  .brand-name { font-weight: 800; font-size: 15.5px; letter-spacing: -0.4px; line-height: 1.25; white-space: nowrap; }
  #modelLabel {
    display: inline-block; margin-top: 2px; font-size: 10px; font-weight: 700;
    color: var(--fg-dim); background: var(--bg); border: 1px solid var(--border);
    padding: 1px 8px; border-radius: 999px; letter-spacing: 0;
  }
  .loading-badge {
    background: var(--accent-dim); color: var(--accent); padding: 6px 14px;
    border-radius: 999px; border: 1px solid var(--border); font-size: 11px;
  }
  .controls { gap: 6px; }
  .controls .ghost { border-color: transparent; background: transparent; }
  .controls .ghost:hover { background: var(--accent-dim); border-color: transparent; }
  .controls .icon-btn { width: 34px; height: 34px; padding: 0; border-radius: 11px; font-size: 15px; }
  .controls .small { height: 34px; border-radius: 11px; padding: 0 13px; font-size: 12px; }

  /* -- 생성 설정 팝업 -- */
  .settings-pop {
    position: absolute; top: calc(100% + 10px); right: 14px; width: 276px; z-index: 90;
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow-md); padding: 18px; display: flex; flex-direction: column; gap: 16px;
    animation: fadeInUp 0.18s ease;
  }
  .settings-pop[hidden] { display: none; }
  .pop-title { font-size: 10.5px; font-weight: 800; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .settings-pop .temp-ctl { min-width: 0; gap: 6px; }
  .settings-pop .ctl label { font-size: 12px; display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; color: var(--fg); }
  .settings-pop .temp-desc { color: var(--accent); font-weight: 700; }
  .settings-pop input[type="range"] { accent-color: var(--accent); }
  .pop-field { display: flex; flex-direction: column; gap: 7px; font-size: 12px; font-weight: 700; color: var(--fg); }
  #maxTokensSel, #personaSel {
    width: 100%; max-width: none; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 11px; padding: 9px 11px;
    font-size: 13px; font-family: inherit; outline: none; cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #maxTokensSel:focus, #personaSel:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

  /* -- 사이드바 -- */
  .sidebar { background: var(--bg-soft); border-right: 1px solid var(--border); }
  .sidebar-head { padding: 14px 12px 10px; gap: 9px; border-bottom: none; }
  #newChatBtn {
    gap: 8px; border-radius: 13px; padding: 11px 14px; font-size: 13.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 16px rgba(80,110,255,0.3);
  }
  #newChatBtn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
  #convSearch { border-radius: 12px; background: var(--bg); padding: 9px 13px; border-color: transparent; }
  #convSearch:focus { border-color: var(--accent); }
  .conv-list { padding: 4px 10px 10px; gap: 3px; }
  .conv-item { border-radius: 12px; padding: 9px 10px; }
  .conv-item:hover { background: var(--bg-raised); }
  .conv-item.active { background: var(--accent-dim); }
  .conv-item.active .conv-title { color: var(--accent); }
  .conv-ava { border-radius: 9px; background: var(--bg); }
  .conv-act { border-radius: 8px; }
  .conv-act:hover { background: var(--bg-raised); }
  .sidebar-foot { border-top: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-tip { margin-top: 0; line-height: 1.75; }

  /* -- 메시지 (사용자 말풍선 / 어시스턴트는 여백 있는 텍스트) -- */
  .row.bot { gap: 11px; align-items: flex-start; }
  .row.bot .avatar {
    width: 32px; height: 32px; border-radius: 10px; font-size: 15px; margin-top: 3px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    border: none; box-shadow: 0 4px 12px rgba(80,110,255,0.3);
  }
  .row.user .avatar { display: none; }
  .msg { max-width: 100%; }
  .msg.bot { background: transparent; border: none; box-shadow: none; padding: 0 6px 6px; border-radius: 0; }
  .msg.bot .meta { margin-bottom: 8px; }
  .msg.bot .meta span:first-child { font-size: 12px; font-weight: 800; color: var(--fg); }
  .msg.user {
    background: linear-gradient(135deg, var(--bg-user), var(--accent-2));
    color: #fff; border: none; border-radius: 18px 18px 5px 18px;
    padding: 12px 18px; font-size: 15px; font-weight: 500;
    box-shadow: 0 3px 14px rgba(70,100,240,0.22);
  }
  .row.user .msg .meta { color: rgba(255,255,255,0.65); }
  .msg .btext.md pre { border-radius: 14px; }
  .msg .btext.md code { border-radius: 6px; }
  .metrics { margin-top: 10px; opacity: 0.85; }
  .actions { margin-top: 12px; gap: 4px; }
  .actions button {
    background: transparent; color: var(--fg-dim); border: 1px solid transparent;
    padding: 5px 11px; font-size: 11.5px; border-radius: 9px;
  }
  .actions button:hover { background: var(--bg-raised); color: var(--accent); border-color: var(--border); filter: none; }
  @media (hover: hover) {
    .actions { opacity: 0; transition: opacity 0.18s ease; }
    .msg-wrapper:hover .actions, .actions:focus-within { opacity: 1; }
  }
  .msg-actions { border-radius: 10px; }
  .msg-wrap:hover .msg-actions, .msg-wrapper:hover .msg-actions, .msg-actions:focus-within { display: flex; }

  /* -- 웰컴 화면 + 제안 카드 -- */
  .intro-card { padding: 56px 24px 26px; max-width: 720px; }
  .intro-card .quote-icon {
    width: 62px; height: 62px; margin: 0 auto 22px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    box-shadow: 0 12px 28px rgba(80,110,255,0.35);
  }
  .intro-card .quote-text {
    font-size: 30px; font-weight: 800; letter-spacing: -0.7px; line-height: 1.35; margin-bottom: 12px;
    background: linear-gradient(115deg, var(--fg) 30%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .intro-card .quote-author { font-size: 12px; font-weight: 600; letter-spacing: 0; margin-bottom: 26px; }
  .intro-card .guide { font-size: 13.5px; line-height: 1.9; }
  #chips {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px; max-width: 720px; margin: 0 auto; padding: 10px 24px 24px;
  }
  .chip {
    background: var(--bg-raised); color: var(--fg); border: 1px solid var(--border);
    border-radius: 15px; padding: 14px 16px; font-size: 13px; font-weight: 500;
    text-align: left; line-height: 1.55; white-space: normal; justify-content: flex-start;
    box-shadow: var(--shadow-sm); transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--bg-raised); box-shadow: var(--shadow-md); filter: none; }

  /* -- 컴포저 (입력 카드) -- */
  footer {
    display: block; border-top: none; background: transparent;
    padding: 8px 24px calc(14px + env(safe-area-inset-bottom));
    max-width: calc(var(--content-max) + 48px); width: 100%; margin: 0 auto;
  }
  .composer {
    background: var(--bg-raised); border: 1.5px solid var(--border);
    border-radius: 22px; padding: 6px 8px 8px 18px;
    box-shadow: var(--shadow-md); transition: border-color 0.2s ease, box-shadow 0.2s ease;
    display: flex; flex-direction: column;
  }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim), var(--shadow-md); }
  .composer #input {
    border: none; background: transparent; box-shadow: none; outline: none;
    padding: 11px 4px 6px; font-size: 15.5px; max-height: 208px; resize: none;
  }
  .composer #input:focus { outline: none; border: none; box-shadow: none; }
  .composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-left: 2px; }
  #attachBtn {
    width: 34px; height: 34px; padding: 0; border-radius: 11px; font-size: 15px;
    background: transparent; color: var(--fg-dim); border: 1px solid var(--border);
  }
  #attachBtn:hover { color: var(--accent); border-color: var(--accent); filter: none; }
  .composer-right { display: flex; align-items: center; gap: 11px; }
  .char-count { font-size: 10.5px; color: var(--fg-muted); }
  #sendBtn {
    width: 38px; height: 38px; padding: 0; border-radius: 13px; font-size: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    box-shadow: 0 5px 14px rgba(80,110,255,0.32);
  }
  #sendBtn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  #sendBtn.danger { background: #e05560; box-shadow: 0 5px 14px rgba(224,85,96,0.32); }
  .composer-hint { text-align: center; font-size: 10.5px; color: var(--fg-muted); margin-top: 10px; line-height: 1.8; }
  .composer-hint b { color: var(--fg-dim); font-weight: 700; }

  /* -- 부가 요소 -- */
  #scrollBtn {
    width: 42px; height: 42px; border-radius: 50%; bottom: 116px; right: 26px;
    background: var(--bg-raised); border: 1px solid var(--border); box-shadow: var(--shadow-md);
  }
  #scrollBtn:hover { filter: none; transform: translateY(-1px); }
  .model-toast {
    background: var(--fg); color: var(--bg); border-radius: 13px; padding: 11px 20px;
    font-size: 12.5px; bottom: 128px; box-shadow: var(--shadow-md);
  }
  .modal-backdrop { background: rgba(8,10,16,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .modal-card { border-radius: 20px; box-shadow: var(--shadow-md); }
  .modal-card .m-head h3 { font-size: 15px; letter-spacing: -0.3px; }
  #dropOverlay { background: rgba(80,110,255,0.14); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #dropOverlay .drop-card { border-radius: 24px; background: var(--bg-raised); }
  #searchBar { padding: 10px 24px; background: var(--bg-soft); }
  #searchInput { background: var(--bg); border-color: transparent; padding: 8px 16px; }
  #favPanel .fav-head { padding-top: 14px; }
  .regen-model-pop { border-radius: 14px; box-shadow: var(--shadow-md); padding: 6px; }
  .regen-model-pop button { border-radius: 10px; padding: 9px 12px; }
  .load-older button { border-radius: 999px; padding: 6px 16px; font-size: 11.5px; }
  .attach-thumb { border-radius: 12px; }

  /* -- 반응형 -- */
  @media (max-width: 880px) {
    .sidebar { border-right: none; }
  }
  @media (max-width: 768px) {
    header { height: auto; min-height: 54px; padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
    .brand-mark { width: 32px; height: 32px; font-size: 16px; border-radius: 10px; }
    .brand-name { font-size: 14px; }
    .controls .small { padding: 0 10px; }
    footer { padding: 6px 12px calc(12px + env(safe-area-inset-bottom)); }
    .composer { border-radius: 18px; }
    .composer-hint { display: none; }
    .intro-card { padding: 36px 18px 18px; }
    .intro-card .quote-text { font-size: 23px; }
    #chips { grid-template-columns: 1fr; padding: 8px 14px 18px; }
    .msg { max-width: 100%; }
    .msg.user { font-size: 14.5px; padding: 11px 15px; }
    .settings-pop { right: 10px; left: 10px; width: auto; }
  }
  @media (max-width: 480px) {
    .settings-pop .temp-ctl { display: flex; }
    .controls .small { font-size: 0; width: 34px; padding: 0; }
    .controls .small::after { content: "⚡"; font-size: 15px; }
  }

  /* -- 질문 뱅크 -- */
  .qbank-card { width: min(780px, 94vw); max-height: 86vh; display: flex; flex-direction: column; }
  .qbank-card .m-body { overflow-y: auto; }
  .qbank-tabs { display: flex; gap: 6px; margin-left: auto; margin-right: 12px; }
  .qbank-tabs button { border: 1px solid var(--border-light); background: var(--bg-soft); color: var(--fg-dim); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer; }
  .qbank-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .qbank-tools { display: flex; gap: 7px; margin: 2px 0 12px; flex-wrap: wrap; align-items: center; }
  .qbank-tools input[type="search"] { flex: 1; min-width: 150px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-light); background: var(--bg-soft); color: var(--fg); }
  .qbank-cat { border: 1px solid var(--border-light); background: var(--bg-soft); color: var(--fg-dim); border-radius: 999px; padding: 5px 11px; font-size: 11.5px; cursor: pointer; }
  .qbank-cat.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #qbankCustomForm { border: 1px dashed var(--border-light); border-radius: 12px; padding: 12px; margin: 2px 0 12px; display: flex; flex-direction: column; gap: 8px; }
  #qbankCustomForm input, #qbankCustomForm textarea { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-light); background: var(--bg-soft); color: var(--fg); font-family: inherit; font-size: 13px; resize: vertical; }
  .q-accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
  .q-check { display: flex; align-items: center; cursor: pointer; }
  .q-check input { width: 16px; height: 16px; cursor: pointer; }
  .q-sel { padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border-light); background: var(--bg-soft); color: var(--fg); font-size: 12px; }
  .q-run-head { background: var(--accent-dim); border: 1px solid var(--border-light); border-radius: 11px; padding: 11px 14px; font-size: 12.5px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .q-run-item { border: 1px solid var(--border); background: var(--bg-soft); border-radius: 11px; padding: 11px 14px; margin-bottom: 9px; }
  .q-run-line { font-size: 12.5px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .q-run-status { margin-left: auto; color: var(--fg-muted); font-size: 11.5px; }
  .q-run-q { margin-top: 6px; font-size: 12px; color: var(--fg-muted); white-space: pre-wrap; word-break: break-word; border-left: 3px solid var(--border-light); padding-left: 9px; }
  .q-run-item details { margin-top: 8px; }
  .q-run-item summary { cursor: pointer; font-size: 12px; color: var(--fg-dim); }

<script>
const $ = id => document.getElementById(id);
const msgs = $("messages"), input = $("input"), sendBtn = $("sendBtn"), scrollBtn = $("scrollBtn");

// ---- 에러 로깅 헬퍼 ----
window.onerror = (msg, src, line, col, err) => {
  console.error("[JS Error]", msg, "at line", line, col, err);
};
window.addEventListener("unhandledrejection", e => {
  console.error("[Unhandled Promise Rejection]", e.reason);
});

// ---- markdown options (줄바꿈 보존 B4) ----
if (window.marked) { try { marked.setOptions({ gfm: true, breaks: true }); } catch(e){} }

// ---- store (다중 대화, v3) ----
const STORE_KEY = "llmcomp.v3";
const LEGACY = { hist: "llmcomp.v2.history", set: "llmcomp.v2.settings", theme: "llmcomp.v2.theme" };
let store = { conversations: [], activeId: null, settings: { temp: 0.7, theme: "dark", maxTokens: 2048, thinking: false } };

let history = [];          // activeConv().messages 참조 (기존 로직 호환)
const currentModelKey = "qwen35";   // Qwen3.5-9B 전용 단일 모델
let sending = false, abortCtrl = null;
let pendingMedia = []; // [{name, kind:"pdf"|"excel", file:File}] — 다음 전송에 첨부될 문서

function uid() { return "c_" + Math.random().toString(36).slice(2, 10); }
function titleFromText(t) { return (t||"").replace(/\s+/g," ").trim().slice(0, 24) || "새 대화"; }

function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){} }
function activeConv() { return store.conversations.find(c => c.id === store.activeId) || null; }
function syncHistoryRef() { const c = activeConv(); history = c ? c.messages : []; }

function newConversation(model, opts={}) {
  const c = { id: uid(), title: "새 대화", model: model || currentModelKey, messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  store.conversations.unshift(c);
  store.activeId = c.id;
  if (!opts.silent) saveStore();
  return c;
}
function ensureConv() { let c = activeConv(); if (!c) c = newConversation(currentModelKey); return c; }

function switchConversation(id) {
  if (sending || id === store.activeId) { closeSidebar(); return; }
  store.activeId = id; saveStore(); syncHistoryRef();
  pendingMedia = [];
  renderedCount = INIT_RENDER_WINDOW;
  updateModelLabel(); renderAll(); closeSidebar(); input.focus();
}
function deleteConversation(id) {
  if (sending) { toastMsg("응답 생성 중에는 삭제할 수 없어요"); return; }
  const c = store.conversations.find(x => x.id === id); if (!c) return;
  if (!confirm(`"${c.title}" 대화를 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) return;
  store.conversations = store.conversations.filter(x => x.id !== id);
  if (store.activeId === id) {
    store.activeId = store.conversations[0] ? store.conversations[0].id : null;
    if (!store.activeId) newConversation(currentModelKey);
    syncHistoryRef();
  }
  saveStore(); updateModelLabel(); renderedCount = INIT_RENDER_WINDOW; renderAll();
}
function renameConversation(id) {
  const c = store.conversations.find(x => x.id === id); if (!c) return;
  const item = document.querySelector(`.conv-item[data-id="${id}"]`);
  if (!item) return;
  const titleEl = item.querySelector(".conv-title");
  const inp = document.createElement("input");
  inp.type = "text"; inp.className = "conv-rename"; inp.value = c.title; inp.setAttribute("aria-label","대화 제목");
  titleEl.replaceWith(inp); inp.focus(); inp.select();
  const done = (commit) => {
    if (commit) { const v = inp.value.trim(); if (v) { c.title = v; saveStore(); } }
    renderConvList($("convSearch").value);
  };
  inp.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && !ev.isComposing && ev.keyCode !== 229) { ev.preventDefault(); done(true); }
    else if (ev.key === "Escape") { ev.preventDefault(); done(false); }
  });
  inp.addEventListener("blur", () => done(true));
}

function migrateLegacy() {
  try {
    const d = JSON.parse(localStorage.getItem(LEGACY.hist) || "{}");
    if (d.history && d.history.length) {
      const c = { id: uid(), title: titleFromMessages(d.history), model: d.model || "qwen35", messages: d.history, createdAt: 0, updatedAt: 0 };
      store.conversations = [c];
      store.activeId = c.id;
    }
  } catch(e) {}
  try {
    const s = JSON.parse(localStorage.getItem(LEGACY.set) || "{}");
    if (s.temp) store.settings.temp = parseFloat(s.temp);
  } catch(e) {}
  try {
    const t = localStorage.getItem(LEGACY.theme);
    if (t === "light" || t === "dark") store.settings.theme = t;
  } catch(e) {}
  if (!store.conversations.length) newConversation(currentModelKey, { silent: true });
  saveStore();
}
function titleFromMessages(msgs2) {
  const u = (msgs2||[]).find(m => m.role === "user");
  return u ? titleFromText(u.content) : "가져온 대화";
}
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.conversations)) {
        store = { conversations: d.conversations, activeId: d.activeId, settings: Object.assign({ temp:0.7, theme:"dark", maxTokens:2048, thinking:false }, d.settings||{}) };
        store.conversations.forEach(ensureMsgIds);
        if (!store.conversations.length) newConversation(currentModelKey, { silent: true });
        if (!store.activeId || !activeConv()) store.activeId = store.conversations[0].id;
        return;
      }
    }
  } catch(e) {}
  migrateLegacy();
}

// ---- sidebar render ----
function renderConvList(filter) {
  const list = $("convList");
  const f = (filter ?? $("convSearch").value).trim().toLowerCase();
  const items = store.conversations.filter(c =>

function escapeHtml(s) { return (s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function renderMarkdown(text) {
  let html;
  if (window.marked) { try { html = marked.parse(text); } catch(e) { html = escapeHtml(text); } }
  else { html = escapeHtml(text); }
  if (window.DOMPurify) html = DOMPurify.sanitize(html);
  return html;
}
function highlightCode(root) { if (window.hljs) root.querySelectorAll("pre code").forEach(el=>{try{hljs.highlightElement(el)}catch(e){}}); }
function enhanceCodeBlocks(root) {
  root.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".code-copy")) return;
    const code = pre.querySelector("code"); if (!code) return;
    // 언어 배지 (highlight.js가 code에 language-xxx 클래스를 붙임)
    const lm = (code.className || "").match(/language-([\w+#-]+)/);
    if (lm) {
      const lbl = document.createElement("span");
      lbl.className = "code-lang"; lbl.textContent = lm[1];
      pre.appendChild(lbl);
    }
    const btn = document.createElement("button");
    btn.className = "code-copy"; btn.type = "button"; btn.textContent = "복사";
    btn.addEventListener("click", () => {
      navigator.clipboard.writeText(code.textContent);
      btn.textContent = "복사됨 ✓"; setTimeout(()=>btn.textContent="복사", 1200);
    });
    pre.appendChild(btn);
  });
}
function wrapTables(root) {
  // 표가 말풍선 밖으로 넘치지 않도록 가로 스크롤 래퍼로 감싼다
  root.querySelectorAll("table").forEach(tbl => {
    if (tbl.parentElement && tbl.parentElement.classList.contains("table-wrap")) return;
    const w = document.createElement("div"); w.className = "table-wrap";
    tbl.replaceWith(w); w.appendChild(tbl);
  });
}

}

// -- SSE --
async function streamChat(onToken, signal, onStatus, onIdle) {
  console.log("[streamChat] Starting with model:", currentModelKey, "messages:", history.length);
  // 연결(POST) 실패 시에만 최대 2회 재시도. 스트리밍 도중 끊김은 중복 토큰 방지상 재시도 안 함.
  let resp = null, lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      resp = await fetch("/api/chat", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model: currentModelKey,
          messages: history,
          temperature: parseFloat($("temp").value),
          max_tokens: store.settings.maxTokens,
          thinking: !!store.settings.thinking,
          ...(store.settings.persona ? { system: store.settings.persona } : {}),
        }),
        signal,
      });
      break;
    } catch (e) {
      lastErr = e;
      if (signal.aborted || e.name === "AbortError") throw e;
      if (attempt < 2) { if (onStatus) onStatus(`연결 재시도 중… (${attempt+1}/2)`); await new Promise(r => setTimeout(r, 700*(attempt+1))); }
      else throw e;
    }
  }
  if (!resp) throw lastErr || new Error("연결 실패");
  if (!resp.ok || !resp.body) throw new Error("stream error "+resp.status);
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "", errMsg = null, doneFlag = false, metrics = null;
  while (true) {
    const {done,value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0,i); buf = buf.slice(i+2);
      for (const line of raw.split("\n")) {
        if (!line.startsWith("data: ")) continue;
        let obj; try { obj = JSON.parse(line.slice(6)); } catch(e) { continue; }
        if (obj.token) { onToken(obj.token); if (onIdle) onIdle(); }
        else if (obj.status) { setLoading(true); if (onStatus) onStatus(obj.status); if (onIdle) onIdle(); }
        else if (obj.done) { doneFlag = true; if (obj.metrics) metrics = obj.metrics; }
        else if (obj.error) errMsg = obj.error;
      }
    }
  }
  setLoading(false);
  return { done: doneFlag, error: errMsg, metrics };
}

// -- flow --
function fillUserBubble(bubble, text) {
  bubble.innerHTML = "";
  if (text) { const t = document.createElement("div"); t.textContent = text; t.style.whiteSpace = "pre-wrap"; bubble.appendChild(t); }
}
async function submitUser(text) {
  if (sending) return;
  text = (text ?? input.value).trim();
  const media = pendingMedia.slice();
  if (!text && !media.length) return;
  if (!text && media.length) text = "첨부한 문서를 분석해 주세요.";
  ensureConv(); syncHistoryRef();
  const c = activeConv();

  // ---- 문서 파일 업로드 (multipart → file_id) ----
  // 문서를 서버에 먼저 업로드해 base64 JSON 전송을 피함
  const documentFileIds = [];  // PDF/엑셀 파일 ID
  const uploadedFileIds = [];

  for (const m of media) {
    if (!m.file) {
      toastMsg(`파일을 다시 첨부해 주세요: ${m.name}`);
      return;
    }
    try {
      const formData = new FormData();
      formData.append("file", m.file, m.name);
      const resp = await fetch("/api/media", { method: "POST", body: formData });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || `upload failed (${resp.status})`);
      }
      const result = await resp.json();
      uploadedFileIds.push(result.file_id);
      documentFileIds.push(result.file_id);
    } catch (e) {
      await Promise.all(uploadedFileIds.map(id => fetch(`/api/media/${encodeURIComponent(id)}`, {method:"DELETE"}).catch(() => {})));
      toastMsg(`파일 업로드 실패: ${m.name} — ${e.message}`);
      return;
    }
  }

  // 메시지 구성 (서버 전송용)
  // 이전 메시지의 첨부 ID를 유지해야 후속 대화에서 문서 문맥이 보존된다.
  const userMsg = { id: uid(), role: "user", content: text };
  if (documentFileIds.length) userMsg.document_file_ids = documentFileIds;

  history.push(userMsg);
  const msgIdx = history.length - 1;

  if ((c.title === "새 대화" || !c.title) && c.messages.filter(m=>m.role==="user").length === 1) c.title = titleFromText(text);
  c.updatedAt = Date.now();
  saveStore(); renderConvList();

  const ur = mkRow("user", null, { midx: msgIdx, msgid: userMsg.id });
  fillUserBubble(ur._bubble, text);
  attachUserActions(ur.parentElement, userMsg.id);
  pendingMedia = []; renderAttachRow();
  input.value = ""; autoGrow(); updateCharCount(); renderChips();
  await runAssistant();
}
async function runAssistant() {
  setSending(true);
  setLoading(true);
  const savedModel = currentModelKey;
  const row = mkRow("bot", savedModel), bt = row._bt;
  bt.classList.add("cursor");
  bt.innerHTML = `<span class="turn-status" style="color:var(--fg-dim)">⏳ 모델 로딩 대기 중... (잠시만 기다려 주세요)</span>`;
  let raw = "", timedOut = false, idleTimer;
  // 문서 분석이 포함되면 응답까지 시간이 더 걸릴 수 있음 (5분)
  const idleMs = 300000;
  const resetIdle = () => { clearTimeout(idleTimer); idleTimer = setTimeout(()=>{timedOut=true;if(abortCtrl)abortCtrl.abort()}, idleMs); };
  abortCtrl = new AbortController(); resetIdle();

  let firstTokenReceived = false;
  let lastPaint = 0;
  function appendToken(tok) {
    if (!firstTokenReceived) {
      firstTokenReceived = true;
      bt.classList.add("md");
      setLoading(false);
    }
    raw += tok; resetIdle();
    // 스트리밍 중에도 마크다운을 실시간 렌더링 (150ms 스로틀로 부하 제어)
    const t = Date.now();
    if (t - lastPaint > 150) { lastPaint = t; bt.innerHTML = renderMarkdown(raw); }
    scrollBottom();
  }
  function showStatus(status) {
    // 로딩 상태 표시 (아직 토큰 안 왔을 때)
    if (!firstTokenReceived) {
      bt.textContent = status;
    }
    scrollBottom();
  }

  console.log("[runAssistant] Starting streamChat for model:", savedModel);
  try {
    const res = await streamChat(
      appendToken,
      abortCtrl.signal,
      showStatus,
      resetIdle
    );
    console.log("[runAssistant] streamChat completed:", res);
    bt.classList.remove("cursor");
    setLoading(false);
    if (timedOut) {
      bt.textContent = raw || "(응답 시간 초과)";
      if (raw) { bt.classList.add("md"); commitAssistant(row, raw, savedModel, null); }
    } else if (res.error && !raw) {
      bt.textContent = "("+res.error+")";
    } else {
      bt.classList.add("md"); bt.innerHTML = renderMarkdown(raw); finalizeMarkdown(bt);
      addMetrics(row._bubble, res.metrics); commitAssistant(row, raw, savedModel, res.metrics);
    }
  } catch(e) {
    bt.classList.remove("cursor");
    if (e.name === "AbortError") {
      bt.classList.add("md"); bt.innerHTML = renderMarkdown(raw)||"<i>(중단됨)</i>"; finalizeMarkdown(bt);
      if (raw) commitAssistant(row, raw, savedModel, null);
    } else { bt.textContent = "(오류: "+e.message+")"; }
  } finally {
    clearTimeout(idleTimer); setSending(false); abortCtrl = null; scrollBottom(); input.focus(); renderChips();
  }
}

// -- actions --
function addActions(row, raw, msg) {
  const acts = document.createElement("div"); acts.className = "actions";
  const copy = document.createElement("button"); copy.className = "ghost small"; copy.textContent = "복사";
  copy.setAttribute("aria-label","응답 복사");
  copy.onclick = () => { navigator.clipboard.writeText(raw); copy.textContent = "복사됨 ✓"; setTimeout(()=>copy.textContent="복사", 1200); };
  acts.appendChild(copy);
  if (msg && msg.id) {
    const regen = document.createElement("button"); regen.className = "ghost small"; regen.textContent = "↻ 다시";
    regen.setAttribute("aria-label","재생성"); regen.title="재생성";
    regen.onclick = () => regenerate(msg.id);
    const fav = document.createElement("button"); fav.className = "ghost small"; fav.setAttribute("data-fav", msg.id);
    fav.setAttribute("aria-label","즐겨찾기"); fav.title="즐겨찾기에 추가";
    const syncFav = () => { const on = !!(activeConv().messages.find(m=>m.id===msg.id)||{}).fav; fav.textContent = on ? "★" : "☆"; fav.style.color = on ? "#e0a020" : ""; };
    syncFav();
    fav.onclick = () => { toggleFav(msg.id); syncFav(); };
    acts.appendChild(regen); acts.appendChild(fav);
  }
  row._bubble.appendChild(acts);
  setupCollapsible(row._bt, acts);
}

// 스트리밍 완료 후 assistant 메시지를 history 에 커밋하고 액션/식별자 연결
function commitAssistant(row, raw, model, metrics){
  if(!raw) return null;
  const c = activeConv();
  const msg = { id: uid(), role:"assistant", content:raw, model, metrics: metrics||undefined };
  c.messages.push(msg); saveStore();
  const wrap = row.parentElement;
  if(wrap){ wrap.dataset.msgid = msg.id; wrap.dataset.midx = String(c.messages.length-1); }
  addActions(row, raw, msg);
  renderConvList();
  return msg;
}
function addMetrics(bubble, m) {
  if (!m) return;
  const el = document.createElement("div"); el.className = "metrics";
  const p = [];
  if (m.cite) p.push("📖 인용 <b>"+m.cite+"</b>");
  p.push("¶ <b>"+m.para+"</b>문단");
  if (m.elapsed_ms) p.push("⏱ <b>"+(m.elapsed_ms/1000).toFixed(1)+"</b>s");
  if (m.toks_per_s) p.push("⚡ <b>"+m.toks_per_s+"</b> tok/s");
  el.innerHTML = p.join(" · "); bubble.appendChild(el);
}

// -- edit user msg (IME 가드 + 이전 응답까지 정상 제거) --
msgs.addEventListener("dblclick", e => {
  const bubble = e.target.closest(".msg.user"); if (!bubble || sending) return;
  const wrap = bubble.closest(".msg-wrapper");
  const c = activeConv(); if (!c || !wrap) return;
  // 지연 렌더링(이전 메시지 더 보기)과 무관하게 dataset.midx로 정확한 메시지를 찾는다.
  const target = wrap.dataset.midx != null ? c.messages[Number(wrap.dataset.midx)] : c.messages.find(m => m.id === wrap.dataset.msgid);
  if (!target || target.role !== "user") return;
  const origText = target?.content || "";
  const ta = document.createElement("textarea"); ta.className = "edit-area"; ta.value = origText;
  ta.style.height = Math.min(ta.scrollHeight, 160)+"px";
  bubble.replaceWith(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  const commit = () => {
    const newText = ta.value.trim(); if (!newText) { ta.replaceWith(bubble); return; }
    const histIdx = c.messages.indexOf(target);
    if (histIdx >= 0) {
      const restored = {...target, content:newText};
      c.messages = c.messages.slice(0, histIdx);
      c.messages.push(restored);
      history = c.messages; // 재동기화
    }
    c.updatedAt = Date.now(); saveStore();
    // 편집된 사용자 말풍선은 유지하고, 그 뒤 메시지만 제거한 뒤 재생성한다.
    ta.replaceWith(bubble);
    fillUserBubble(bubble, newText);
    attachUserActions(wrap, target.id);
    let el = wrap.nextSibling;
    while (el) { const nxt = el.nextSibling; el.remove(); el = nxt; }
    renderChips(); runAssistant();
  };
  ta.addEventListener("keydown", ev => { if (ev.key==="Enter"&&!ev.shiftKey&&!ev.isComposing&&ev.keyCode!==229) { ev.preventDefault(); commit(); } });
  ta.addEventListener("blur", () => setTimeout(() => { if (document.body.contains(ta)) commit(); }, 120));
});

// -- 문서 첨부 (PDF/엑셀) --
function mediaKind(file) {
    if (file.name?.toLowerCase().endsWith(".pdf") || file.type === "application/pdf") return "pdf";
    if (file.name?.toLowerCase().match(/\.xlsx?$/i)) return "excel";
    return "unknown";
}
function renderAttachRow() {
  const row = $("attachRow");
  if (!pendingMedia.length) { row.hidden = true; row.innerHTML = ""; return; }
  row.hidden = false; row.innerHTML = "";
  pendingMedia.forEach((m, i) => {
    const t = document.createElement("div"); t.className = "attach-thumb"; t.title = m.name || "";
    const icon = m.kind === "excel" ? "📊" : "📄";
    t.innerHTML = `<svg width="60" height="60" viewBox="0 0 60 60" style="display:block"><rect width="60" height="60" rx="8" fill="var(--bg)"/><text x="30" y="38" font-size="28" text-anchor="middle">${icon}</text></svg>`;
    const rm = document.createElement("button"); rm.className = "rm"; rm.type = "button"; rm.textContent = "×";
    rm.setAttribute("aria-label", "첨부 제거");
    rm.onclick = () => { pendingMedia.splice(i, 1); renderAttachRow(); };
    row.appendChild(t);
  });
}
$("attachBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", async (e) => {
  for (const f of Array.from(e.target.files || [])) {
    const kind = mediaKind(f);
    if (kind === "unknown") { toastMsg(`지원하지 않는 파일: ${f.name} (PDF/엑셀만 가능)`); continue; }
    pendingMedia.push({ name: f.name || kind, kind, file: f });
  }
  e.target.value = ""; renderAttachRow(); input.focus();
});

// -- render history --
function renderHistory() {
  msgs.innerHTML = "";
  ensureMsgIds(activeConv());
  const total = history.length;
  const start = Math.max(0, total - renderedCount);
  if (start > 0) {
    const lo = document.createElement("div"); lo.className = "load-older";
    lo.innerHTML = `<button class="ghost small">▴ 이전 메시지 ${start}개 더 보기</button>`;
    lo.querySelector("button").onclick = () => { renderedCount += 60; renderHistory(); scrollBottom(false); };
    msgs.appendChild(lo);
  }
  for (let idx = start; idx < total; idx++) {
    const m = history[idx];
    if (m.role === "user") {
      const r = mkRow("user", null, { midx: idx, msgid: m.id });
      fillUserBubble(r._bubble, m.content);
      attachUserActions(r.parentElement, m.id);
    } else {
      const r = mkRow("bot", m.model, { midx: idx, msgid: m.id });
      r._bt.classList.add("md"); r._bt.innerHTML = renderMarkdown(m.content||""); finalizeMarkdown(r._bt);
      if (m.content) { addActions(r, m.content, m); if (m.metrics) addMetrics(r._bubble, m.metrics); }
    }
  }
  scrollBottom(true);
  setTimeout(() => { scrollToLatest(); updateScrollBtn(); }, 100);
}
function renderAll() { renderHistory(); renderChips(); renderConvList(); }

// ---- 즐겨찾기(★) ----
function toggleFav(msgId){
  const c = activeConv(); if(!c) return;
  const m = c.messages.find(x=>x.id===msgId); if(!m) return;
  m.fav = !m.fav; saveStore();
  document.querySelectorAll(`[data-fav="${msgId}"]`).forEach(b=>b.classList.toggle("active-fav",!!m.fav));
  renderFavPanel();
}
function renderFavPanel(){
  const list = $("favList"); if(!list) return;
  list.innerHTML = "";
  const favs = [];
  for(const c of store.conversations) for(const m of c.messages) if(m.fav) favs.push({conv:c, msg:m});
  if(!favs.length){ list.innerHTML = '<div class="fav-empty">아직 즐겨찾기한 답변이 없어요. 답변의 ⭐ 버튼으로 저장하세요.</div>'; return; }
  for(const {conv,msg} of favs){
    const it = document.createElement("div"); it.className = "fav-item";
    const info = getModelInfo(msg.model);
    it.innerHTML = `<div class="fav-meta">${info.avatar} ${escapeHtml(info.name)} · <span style="color:var(--fg-muted)">${escapeHtml(conv.title||"대화")}</span></div><div class="fav-text">${escapeHtml((msg.content||"").replace(/\s+/g," ").slice(0,180))}</div>`;
    it.addEventListener("click", ()=>{
      if(conv.id !== store.activeId){ switchConversation(conv.id); setTimeout(()=>scrollToMsg(msg.id),120); }
      else scrollToMsg(msg.id);
      closeSidebar();
    });
    list.appendChild(it);
  }
}
function scrollToMsg(msgId){
  const wrap = msgs.querySelector(`.msg-wrapper[data-msgid="${msgId}"]`);
  if(wrap){ wrap.scrollIntoView({behavior:"smooth",block:"center"}); pulse(wrap); }
}

// ---- 대화내 검색 ----
let searchState = {q:"",hits:[],idx:-1};
function openSearch(){ closeAllPanels(); $("searchBar").classList.add("open"); setTimeout(()=>$("searchInput").focus(),0); }
function closeSearch(){ $("searchBar").classList.remove("open"); $("searchInput").value=""; searchState={q:"",hits:[],idx:-1}; $("searchCount").textContent=""; }
function doSearch(q){
  searchState.q = q.trim().toLowerCase(); searchState.hits = []; searchState.idx = -1;
  if(!searchState.q){ $("searchCount").textContent=""; return; }
  const c = activeConv();
  (c?.messages||[]).forEach((m,i)=>{ if((m.content||"").toLowerCase().includes(searchState.q)) searchState.hits.push(i); });
  if(searchState.hits.length){ navSearch(0); } else { $("searchCount").textContent = "없음"; }
}
function navSearch(dir){
  if(!searchState.hits.length) return;
  if(dir===0){ searchState.idx = 0; }                                   // 첫 히트로 점프
  else { searchState.idx = (searchState.idx + dir + searchState.hits.length) % searchState.hits.length; }
  const msgIdx = searchState.hits[searchState.idx];
  ensureRenderedUpTo(msgIdx);
  const wrap = msgs.querySelector(`.msg-wrapper[data-midx="${msgIdx}"]`);
  if(wrap){ wrap.scrollIntoView({behavior:"smooth",block:"center"}); pulse(wrap); }
  $("searchCount").textContent = `${searchState.idx+1}/${searchState.hits.length}`;
}
function ensureRenderedUpTo(msgIdx){
  // renderHistory는 마지막 renderedCount개를 그리므로 msgIdx를 포함하려면 이만큼 필요
  const needed = history.length - msgIdx + 1;
  if(needed > renderedCount){ renderedCount = needed; renderHistory(); }
}

let dragDepth = 0;
function guessLang(name){ const m=String(name).match(/\.(\w+)$/); return m?m[1].toLowerCase():"text"; }
const TEXT_EXT = /\.(txt|md|markdown|py|js|mjs|ts|tsx|jsx|json|csv|tsv|log|java|c|cc|cpp|h|hpp|cs|go|rs|rb|php|swift|kt|sh|bash|zsh|yml|yaml|toml|ini|xml|html|htm|css|scss|sql|r)$/i;
async function handleDroppedFiles(files){
  for(const f of files){
    const kind = mediaKind(f);
    if(kind === "pdf" || kind === "excel"){
      pendingMedia.push({name:f.name||kind, kind, file:f});
      continue;
    }
    if(f.type.startsWith("text/") || TEXT_EXT.test(f.name)){
      try{ const text = await f.text();
        input.value += (input.value?"\n\n":"") + "```"+guessLang(f.name)+"\n"+text+"\n```";
        autoGrow(); updateCharCount(); toastMsg(`📎 ${f.name} 내용 삽입`);
      }catch(e){ toastMsg(`파일 읽기 실패: ${f.name}`); }
    } else { toastMsg(`지원하지 않는 파일: ${f.name} (PDF/엑셀·텍스트 파일만 가능)`); }
  }
  renderAttachRow(); input.focus();
}

function conversationToMarkdown(c){
  const info = getModelInfo(c.model);
  let md = `# ${c.title||"대화"}\n\n> 모델: ${info.name} · ${new Date(c.updatedAt||Date.now()).toLocaleString("ko-KR")}\n\n---\n\n`;
  for(const m of c.messages){
    if(m.role==="user") md += `## 🧑 사용자\n\n${m.content||""}\n\n`;
    else { const mi=getModelInfo(m.model); md += `## ${mi.avatar} ${mi.name}\n\n${m.content||""}\n\n`; if(m.metrics) md += `> ⚡ ${m.metrics.toks_per_s||"-"} tok/s · ⏱ ${((m.metrics.elapsed_ms||0)/1000).toFixed(1)}s · ¶ ${m.metrics.para||"-"}문단\n\n`; }
  }
  return md;
}

// ---- 인쇄 / PDF (미리보기 창에서 바로 인쇄) ----
function printConversation(c){
  const w = window.open("", "_blank");
  if(!w){ toastMsg("팝업이 차단되어 인쇄 미리보기를 열 수 없어요"); return; }

}

// ---- 백업 가져오기 (JSON: 전체 대화 / 메시지 목록 모두 지원) ----
function pickImportFile(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = ()=>{ if(inp.files && inp.files[0]) importConversations(inp.files[0]); };
  inp.click();
}
function importConversations(file){
  file.text().then(txt=>{
    const data = JSON.parse(txt);
    let convs = [];
    if(Array.isArray(data)){
      if(data.length && data.every(m=>m && typeof m==="object" && "role" in m && "content" in m)){
        convs = [{ id:uid(), title:titleFromMessages(data), model:currentModelKey, messages:data,
                   createdAt:Date.now(), updatedAt:Date.now() }];
      } else {
        convs = data.filter(c=>c && typeof c==="object" && Array.isArray(c.messages));
      }
    } else if(data && Array.isArray(data.conversations)){
      convs = data.conversations.filter(c=>c && Array.isArray(c.messages));
    }
    if(!convs.length){ toastMsg("가져올 대화가 없어요"); return; }
    let added = 0, updated = 0;
    for(const c of convs){
      if(!c.id) c.id = uid();
      if(!c.model) c.model = currentModelKey;
      ensureMsgIds(c);
      const i = store.conversations.findIndex(x=>x.id===c.id);
      if(i>=0){ store.conversations[i] = c; updated++; }
      else { store.conversations.unshift(c); added++; }
    }
    if(!activeConv()) store.activeId = store.conversations[0].id;
    saveStore(); syncHistoryRef(); renderedCount = INIT_RENDER_WINDOW; renderAll();
    toastMsg(`📤 가져오기 완료: ${added}개 추가 · ${updated}개 갱신`);
  }).catch(e=>toastMsg("가져오기 실패: "+(e&&e.message||e)));
}

// ---- 대화 분기(fork) ----
function forkConversation(msgId){
  if(sending){ toastMsg("응답 생성 중에는 분기할 수 없어요"); return; }
  const c = activeConv(); if(!c) return;
  const idx = c.messages.findIndex(m=>m.id===msgId); if(idx<0) return;
  const cut = c.messages[idx].role==="user" ? idx+1 : idx;
  const prefix = c.messages.slice(0, cut).map(m=>({...m, id:uid(), fav:false}));
  const nc = { id:uid(), title:(c.title||"대화")+" (분기)", model:c.model, messages:prefix, createdAt:Date.now(), updatedAt:Date.now() };
  if(nc.title.length>26) nc.title = nc.title.slice(0,26);
  store.conversations.unshift(nc); store.activeId = nc.id;
  saveStore(); syncHistoryRef(); renderedCount = INIT_RENDER_WINDOW;
  renderAll(); closeSidebar(); toastMsg("🌿 새 대화로 분기했습니다");
}

// ---- 대화 고정 ----
function togglePinConv(id){ const c=store.conversations.find(x=>x.id===id); if(!c) return; c.pinned=!c.pinned; saveStore(); renderConvList(); }

// ---- 재생성 ----
async function regenerate(msgId){
  if(sending) return;
  const c = activeConv(); if(!c) return;
  const idx = c.messages.findIndex(m=>m.id===msgId);
  if(idx>=0 && c.messages[idx].role==="assistant"){ c.messages.splice(idx,1); saveStore(); }
  const wrap = msgs.querySelector(`.msg-wrapper[data-msgid="${msgId}"]`); if(wrap) wrap.remove();
  await runAssistant();
}

// ---- 사용자 메시지 호버 액션바 (분기) ----
function attachUserActions(wrap, msgId){
  if(!wrap || wrap.querySelector(".msg-actions")) return;
  const bar = document.createElement("div"); bar.className="msg-actions";
  const fork = document.createElement("button"); fork.className="msg-action-btn"; fork.type="button"; fork.title="이 지점에서 새 대화로 분기"; fork.textContent="🌿 분기";
  fork.onclick=(e)=>{ e.stopPropagation(); forkConversation(msgId); };
  bar.appendChild(fork);
  wrap.querySelector(".msg.user")?.appendChild(bar);
}

let QCACHE = null;

// ---- 사용자 지정 질문 (localStorage 저장) ----
const QBANK_CUSTOM_KEY = "qbank.custom.v1";
let QCUSTOM = [];
function loadCustomQ(){
  try{ QCUSTOM = JSON.parse(localStorage.getItem(QBANK_CUSTOM_KEY) || "[]") || []; }
  catch(e){ QCUSTOM = []; }
}
function saveCustomQ(){ try{ localStorage.setItem(QBANK_CUSTOM_KEY, JSON.stringify(QCUSTOM)); }catch(e){} }
function qbankAll(){ return [...(QCACHE||[]), ...(QCUSTOM||[])]; }

async function loadQuestionBank(){
  loadCustomQ();
  if(QCACHE) return QCACHE;
  try{
    const r = await fetch("/api/questions");
    const d = await r.json();
    QCACHE = Array.isArray(d.questions) ? d.questions : [];
    // 문항 번호 순서 보장 (Q1 < Q2 < … < Q10 < …)
    QCACHE.sort((a,b)=>parseInt(String(a.id).slice(1),10)-parseInt(String(b.id).slice(1),10));
  }catch(e){ QCACHE = []; toastMsg("질문 뱅크를 불러오지 못했어요"); }
  return QCACHE;
}

function closeQbank(){ $("qbankModal").classList.remove("open"); }
function qbankTab(name){

function renderQbankStars(qs){

  wrap.innerHTML = "";
  stars.forEach((s,i)=>{
    const b = document.createElement("button");
    b.className = "qbank-cat" + (i===0 ? " active" : "");
    b.textContent = s || "전체";
    b.dataset.star = s;

      b.classList.add("active");
      renderQbankList();

function qbankSortList(list, mode){
  const num = x => { const n = parseInt(String(x.id).slice(1), 10); return isNaN(n) ? 1e9 : n; };
  const starScore = x => (String(x.stars||"").match(/★/g)||[]).length - (String(x.stars||"").match(/☆/g)||[]).length * 0.5;
  const arr = list.slice();
  if(mode === "stars") arr.sort((a,b)=> (starScore(b)-starScore(a)) || (num(a)-num(b)));
  else if(mode === "title") arr.sort((a,b)=> String(a.title||"").localeCompare(String(b.title||""), "ko"));
  else arr.sort((a,b)=> (num(a)-num(b)) || String(a.id).localeCompare(String(b.id)));
  return arr;
}

  const nums = QCUSTOM.map(x=>parseInt(String(x.id).slice(1),10)).filter(n=>!isNaN(n));
  const id = "C" + ((nums.length ? Math.max(...nums) : 0) + 1);
  QCUSTOM.push({ id, title: title || `내 질문 ${id}`, question, answer, category: "⭐ 내 질문", stars: "", custom: true });
  saveCustomQ(); closeCustomForm();
  renderQbankCats(qbankAll()); renderQbankStars(qbankAll()); renderQbankList();

      <div class="q-acts">
        <button class="ghost small" data-a="ask">💬 질문하기</button>
        <button class="ghost small" data-a="paste">✏️ 입력창에 넣기</button>
        <button class="ghost small" data-a="answer">💡 정답 요지</button>

      </div>

    item.querySelector(".q-head").addEventListener("click", e=>{ if(!e.target.closest(".q-check")) item.classList.toggle("open"); });  // 질문 본문은 항상 표시(.open 토글은 향후 확장용)
    item.querySelector('[data-a="select"]').addEventListener("change", e=>{
