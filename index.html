// ---- 질문 뱅크 결과 비교 (실행 이력 집계 차트) ----
async function renderQbankStats(){
  const box = $("qbankStats");
  box.innerHTML = '<div class="qbank-empty">실행 이력을 불러오는 중…</div>';
  let sets = [];
  try{ sets = (await (await fetch("/api/results")).json()).sets || []; }catch(e){}
  if(!sets.length){
    box.innerHTML = '<div class="qbank-empty">아직 실행 이력이 없어요.<br>run_questions.bat 로 질문 뱅크를 실행하면 이곳에 자동으로 모입니다.</div>';
    return;
  }
  const agg = {};
  let total = 0, okAll = 0;
  for(const s of sets) for(const r of (s.results||[])){
    total++;
    const a = agg[r.id] = agg[r.id] || {OFF:{ok:0,n:0,toks:[]}, ON:{ok:0,n:0,toks:[]}};
    const m = a[r.mode==="ON" ? "ON" : "OFF"];
    if(!m) continue;
    m.n++;
    if(r.auto==="✓"){ m.ok++; okAll++; }
    if(r.toks_per_s) m.toks.push(r.toks_per_s);
  }
  const avg = xs => xs.length ? xs.reduce((p,c)=>p+c,0)/xs.length : null;
  const bar = (v, max, cls) => `<div class="q-bar"><div class="q-bar-fill ${cls}" style="width:${max ? Math.max(3, Math.round(v/max*100)) : 0}%"></div></div>`;
  const pct = m => m.n ? Math.round(m.ok/m.n*100) : null;
  const fmt = (v, s) => v==null ? "-" : (Math.round(v*10)/10) + (s||"");

  let html = `<div class="qbank-cards">
    <div class="qbank-stat"><div class="qbank-stat-n">${sets.length}</div><div class="qbank-stat-l">실행 세트</div></div>
    <div class="qbank-stat"><div class="qbank-stat-n">${total}</div><div class="qbank-stat-l">총 문항 실행</div></div>
    <div class="qbank-stat"><div class="qbank-stat-n">${total ? Math.round(okAll/total*100) : 0}%</div><div class="qbank-stat-l">전체 자동 정답률</div></div>
  </div>`;
  // 📈 자동 정답률 추이 (라인 차트 — 세트 간 변화)
  const trendIds = ["ALL", ...Object.keys(agg).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1)))];
  html += `<div class="q-sec">📈 자동 정답률 추이 (실행 세트 순 · 문항 선택)</div>
    <div class="qbank-tools">
      <select id="trendQ" class="q-sel" aria-label="추이 차트 문항 선택">${trendIds.map(id=>`<option value="${escapeHtml(id)}">${id==="ALL" ? "전체 문항" : escapeHtml(id)}</option>`).join("")}</select>
      <span class="flat"><span class="q-legend off"></span> OFF · <span class="q-legend on"></span> ON</span>
    </div>
    <div id="qTrend"></div>`;
  const ids = Object.keys(agg).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1)));
  html += '<div class="q-sec">⚔️ 문항별 자동 정답률 (누적 · OFF vs ON)</div><div class="q-chart">';
  for(const id of ids){
    const a = agg[id], o = pct(a.OFF), n = pct(a.ON);
    html += `<div class="q-row"><span class="q-row-l">${escapeHtml(id)}</span>
      <span class="q-row-b">${bar(o||0, 100, "off")}</span><span class="q-row-v">OFF ${o==null?"-":o+"%"}</span>
      <span class="q-row-b">${bar(n||0, 100, "on")}</span><span class="q-row-v">ON ${n==null?"-":n+"%"}</span></div>`;
  }
  html += '</div><div class="q-sec">⚡ 문항별 평균 생성 속도 (tok/s)</div><div class="q-chart">';
  const maxToks = Math.max(1, ...ids.map(id=>Math.max(avg(agg[id].OFF.toks)||0, avg(agg[id].ON.toks)||0)));
  for(const id of ids){
    const a = agg[id], o = avg(a.OFF.toks), n = avg(a.ON.toks);
    html += `<div class="q-row"><span class="q-row-l">${escapeHtml(id)}</span>
      <span class="q-row-b">${bar(o||0, maxToks, "off")}</span><span class="q-row-v">OFF ${fmt(o)}</span>
      <span class="q-row-b">${bar(n||0, maxToks, "on")}</span><span class="q-row-v">ON ${fmt(n)}</span></div>`;
  }
  html += '</div><div class="q-sec">📁 최근 실행 세트</div><table class="q-table"><thead><tr><th>실행 시각</th><th>모드</th><th>항목</th><th>자동 정답</th><th>평균 tok/s</th></tr></thead><tbody>';
  for(const s of sets.slice(0, 10)){
    const rs = s.results||[];
    const ok = rs.filter(r=>r.auto==="✓").length;
    const withAuto = rs.filter(r=>r.auto).length;
    const toks = rs.map(r=>r.toks_per_s).filter(Boolean);
    html += `<tr><td>${escapeHtml(String(s.file).replace("answers_","").replace(".json",""))}</td>
      <td>${escapeHtml((s.meta&&s.meta.modes_text)||"-")}</td><td>${rs.length}</td>
      <td>${withAuto ? ok+"/"+withAuto : "-"}</td><td>${fmt(avg(toks))}</td></tr>`;
  }
  html += '</tbody></table>';
  html = `<div class="q-sec">🔄 세트 간 비교 (기준 → 대상)</div>
    <div class="qbank-tools"><select id="deltaA" class="q-sel" aria-label="비교 기준 세트"></select><span class="flat">→</span><select id="deltaB" class="q-sel" aria-label="비교 대상 세트"></select></div>
    <div id="qbankDelta"></div>` + html;
  box.innerHTML = html;
  // 📈 추이 라인 차트 렌더러 (세트 간 자동 정답률 변화)
  const renderTrend = ()=>{
    const out = $("qTrend"); if(!out) return;
    const qid = ($("trendQ")||{}).value || "ALL";
    const order = sets.slice().reverse();  // 오래된 → 최신
    if(!order.length){ out.innerHTML = '<div class="qbank-empty">추이를 표시할 실행 세트가 없어요.</div>'; return; }
    const W = 720, H = 250, L = 46, R = 14, T = 14, B = 42;
    const iw = W - L - R, ih = H - T - B;
    const x = i => order.length <= 1 ? L + iw/2 : L + iw * i / (order.length - 1);
    const y = v => T + ih * (1 - v / 100);
    const stamp = name => {
      const m = String(name).match(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/);
      return m ? `${m[2]}-${m[3]} ${m[4]}:${m[5]}` : String(name);
    };
    const rate = (s, mode)=>{
      const rs = (s.results||[]).filter(z=>z.auto && z.mode===mode && (qid==="ALL" || z.id===qid));
      return rs.length ? { v: rs.filter(z=>z.auto==="✓").length / rs.length * 100, n: rs.length } : null;
    };
    let svg = `<svg viewBox="0 0 ${W} ${H}" class="q-trend" role="img" aria-label="자동 정답률 추이 차트">`;
    [0,25,50,75,100].forEach(g=>{
      svg += `<line x1="${L}" y1="${y(g)}" x2="${W-R}" y2="${y(g)}" class="q-grid"/>`;
      svg += `<text x="${L-8}" y="${y(g)+4}" class="q-ax" text-anchor="end">${g}%</text>`;
    });
    const labelStep = Math.max(1, Math.ceil(order.length / 8));
    order.forEach((s,i)=>{
      if(i % labelStep !== 0 && i !== order.length - 1) return;
      svg += `<text x="${x(i)}" y="${H-14}" class="q-ax" text-anchor="middle">${escapeHtml(stamp(String(s.file).replace("answers_","").replace(".json","")))}</text>`;
    });
    const draw = (mode, cls)=>{
      const pts = order.map((s,i)=>({ i, p: rate(s, mode) }));
      const segs = []; let cur = [];
      pts.forEach(pt=>{ if(pt.p) cur.push(pt); else { if(cur.length) segs.push(cur); cur = []; } });
      if(cur.length) segs.push(cur);
      segs.forEach(seg=>{
        if(seg.length > 1) svg += `<polyline class="q-line ${cls}" points="${seg.map(pt=>`${x(pt.i)},${y(pt.p.v)}`).join(" ")}"/>`;
      });
      pts.forEach(pt=>{
        if(!pt.p) return;
        const s = order[pt.i];
        const label = stamp(String(s.file).replace("answers_","").replace(".json",""));
        svg += `<circle cx="${x(pt.i)}" cy="${y(pt.p.v)}" r="4.5" class="q-dot ${cls}"><title>${mode} · ${escapeHtml(label)} · 정답률 ${Math.round(pt.p.v)}% (${pt.p.n}문항 실행)</title></circle>`;
      });
    };
    draw("OFF", "off");
    draw("ON", "on");
    svg += "</svg>";
    out.innerHTML = svg;
  };
  // 세트 간 델타 비교 배선
  const opt = s => `<option value="${escapeHtml(s.file)}">${escapeHtml(String(s.file).replace("answers_","").replace(".json",""))} · ${escapeHtml((s.meta&&s.meta.modes_text)||"-")}</option>`;
  const selA = $("deltaA"), selB = $("deltaB");
  selA.innerHTML = sets.slice().reverse().map(opt).join("");
  selB.innerHTML = sets.map(opt).join("");
  selA.value = sets.length > 1 ? sets[1].file : sets[0].file;
  selB.value = sets[0].file;
  const renderDelta = ()=>{
    const a = sets.find(s=>s.file===selA.value), b = sets.find(s=>s.file===selB.value);
    $("qbankDelta").innerHTML = deltaTable(a, b);
  };
  selA.addEventListener("change", renderDelta);
  selB.addEventListener("change", renderDelta);
  renderDelta();
  // 추이 차트 배선
  const trendSel = $("trendQ");
  if(trendSel){ trendSel.addEventListener("change", renderTrend); renderTrend(); }
}

// ---- 질문 뱅크 다중 선택 순차 실행 ----
function autoBadge(auto){
  if(auto==="✓") return '<span class="q-pill ok">✓ 정답</span>';
  if(auto==="✗") return '<span class="q-pill bad">✗ 오답</span>';
  return '<span class="q-pill na">자동확인 없음</span>';
}
function autoCheckQ(x, text){
  const pats = x.check || [];
  if(!pats.length || !text) return "";
  try{ return pats.every(p=>new RegExp(p, "i").test(text)) ? "✓" : "✗"; }catch(e){ return ""; }
}
async function askModelOnce(question, signal){
  const resp = await fetch("/api/chat", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model: currentModelKey,
      messages: [{role:"user", content: question}],
      temperature: parseFloat($("temp").value),
      max_tokens: store.settings.maxTokens,
      thinking: !!store.settings.thinking,
      // 질문 뱅크 실행은 항상 한국어 답변을 받는다 (자동 확인 키워드가 한글 기준)
      system: ["이 질문에 대해 반드시 한국어(한글)로만 답변하세요. 수식·코드·고유명사를 제외한 모든 설명과 결론은 한국어로 작성합니다.", store.settings.persona||""].filter(Boolean).join("\n"),
    }),
    signal,
  });
  if(!resp.ok || !resp.body) return { text:"", metrics:null, error:"연결 실패 "+resp.status };
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", metrics = null, error = null;
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf("\n\n")) >= 0){
      const raw = buf.slice(0, i); buf = buf.slice(i+2);
      for(const line of raw.split("\n")){
        if(!line.startsWith("data: ")) continue;
        let obj; try{ obj = JSON.parse(line.slice(6)); }catch(e){ continue; }
        if(obj.token) text += obj.token;
        else if(obj.done && obj.metrics) metrics = obj.metrics;
        else if(obj.error) error = obj.error;
      }
    }
  }
  return { text, metrics, error };
}
async function runSelectedQuestions(){
  const items = qbankAll().filter(x=>QSEL.has(x.id));
  if(!items.length){ toastMsg("먼저 실행할 문항을 선택하세요 (체크박스)"); return; }
  if(BATCH.running){ toastMsg("이미 실행 중이에요"); return; }
  BATCH.running = true; BATCH.abort = new AbortController();
  $("qbankRunTabBtn").hidden = false;
  qbankTab("run");
  const box = $("qbankRun");
  box.innerHTML = '<div class="q-run-head" id="qbankRunHead"></div>';
  const head = $("qbankRunHead");
  const stopBtn = document.createElement("button");
  stopBtn.className = "ghost small"; stopBtn.textContent = "⏹ 중지";
  stopBtn.addEventListener("click", ()=>{ BATCH.running = false; if(BATCH.abort) BATCH.abort.abort(); });
  const ok = { n:0, done:0 };
  const results = [];
  const prog = document.createElement("span");
  head.appendChild(prog);
  head.appendChild(stopBtn);
  for(let i=0; i<items.length; i++){
    if(!BATCH.running) break;
    const x = items[i];
    const card = document.createElement("div"); card.className = "q-run-item";
    card.innerHTML = `<div class="q-run-line"><b>${escapeHtml(x.id)}</b> ${escapeHtml(x.title)} <span class="q-run-status">⏳ 실행 중…</span></div>
      <div class="q-run-q">${escapeHtml(x.question||"")}</div>
      <details><summary>답변 보기</summary><div class="q-run-text"></div></details>`;
    box.appendChild(card);
    const status = card.querySelector(".q-run-status");
    prog.textContent = `▶ ${i+1}/${items.length} 실행 중 — thinking ${store.settings.thinking?"ON":"OFF"} · 온도 ${parseFloat($("temp").value)}`;
    try{
      const res = await askModelOnce(x.question, BATCH.abort.signal);
      const auto = autoCheckQ(x, res.text);
      if(auto==="✓") ok.n++;
      ok.done++;
      results.push({ id:x.id, question:x.question, answer:res.text, auto, metrics:res.metrics, error:res.error });
      const spd = res.metrics && res.metrics.toks_per_s ? ` · ⚡ ${res.metrics.toks_per_s} tok/s` : "";
      const err = res.error ? ` <span class="down">⚠ ${escapeHtml(res.error)}</span>` : "";
      status.innerHTML = autoBadge(auto) + spd + err;
      card.querySelector(".q-run-text").textContent = res.text || "(빈 답변)";
    }catch(e){
      ok.done++;
      results.push({ id:x.id, question:x.question, answer:"", auto:"", metrics:null, error:String(e&&e.message||e) });
      status.innerHTML = (e && e.name==="AbortError") ? '<span class="q-pill na">중단됨</span>' : `<span class="down">⚠ ${escapeHtml(String(e&&e.message||e))}</span>`;
    }
  }
  BATCH.running = false;
  head.innerHTML = `<span>✅ 완료 ${ok.done}/${items.length} · 🎯 자동 확인 정답 <b>${ok.n}/${ok.done}</b> (참고용)</span>`;
  const saveBtn = document.createElement("button");
  saveBtn.className = "ghost small"; saveBtn.textContent = "📥 결과 저장 (JSON)";
  saveBtn.addEventListener("click", ()=>{
    downloadFile("qbank_run_"+dateStr()+".json", JSON.stringify({
      at: Date.now(), model: currentModelKey, thinking: !!store.settings.thinking,
      temperature: parseFloat($("temp").value), max_tokens: store.settings.maxTokens, results,
    }, null, 2), "application/json");
  });
  head.appendChild(saveBtn);
  return results;
}

// ---- 세트 간 델타 비교 (결과 비교 탭) ----
function compareSets(a, b){
  const agg = (s)=>{
    const rs = s.results||[];
    const autos = rs.map(r=>r.auto).filter(x=>x);
    const toks = rs.map(r=>r.toks_per_s).filter(Boolean);
    return {
      rate: autos.length ? Math.round(autos.filter(x=>x==="✓").length/autos.length*100) : null,
      toks: toks.length ? toks.reduce((p,c)=>p+c,0)/toks.length : null,
    };
  };
  const perQ = (s, id)=>{
    const rs = (s.results||[]).filter(r=>r.id===id);
    const autos = rs.map(r=>r.auto).filter(x=>x);
    const toks = rs.map(r=>r.toks_per_s).filter(Boolean);
    const el = rs.map(r=>(r.elapsed_ms||0)/1000).filter(Boolean);
    const tk = rs.map(r=>r.tokens).filter(Boolean);
    const avg = xs => xs.length ? xs.reduce((p,c)=>p+c,0)/xs.length : null;
    return {
      auto: autos.length ? (autos.every(x=>x==="✓") ? "✓" : (autos.some(x=>x==="✓") ? "◐" : "✗")) : "-",
      toks: avg(toks), elapsed: avg(el), tokens: avg(tk),
    };
  };
  const ids = Array.from(new Set([...(a.results||[]), ...(b.results||[])].map(r=>r.id)))
    .sort((x,y)=>parseInt(x.slice(1))-parseInt(y.slice(1)));
  return { rows: ids.map(id=>({ id, a:perQ(a,id), b:perQ(b,id) })), a:agg(a), b:agg(b) };
}
function deltaTable(sa, sb){
  if(!sa || !sb) return '<div class="qbank-empty">비교할 세트를 선택하세요.</div>';
  const c = compareSets(sa, sb);
  const arrow = (cur, prev, higherBetter, digits, suffix)=>{
    if(cur==null || prev==null) return '<span class="flat">-</span>';
    const d = cur - prev;
    if(Math.abs(d) < (digits===0 ? 0.5 : 1e-9)) return '<span class="flat">＝</span>';
    const good = higherBetter ? d > 0 : d < 0;
    return `<span class="${good?"up":"down"}">${d>0?"▲":"▼"} ${Math.abs(d).toFixed(digits)}${suffix||""}</span>`;
  };
  const label = s => String(s.file).replace("answers_","").replace(".json","");
  let html = `<div class="q-note">기준 <b>${escapeHtml(label(sa))}</b> → 대상 <b>${escapeHtml(label(sb))}</b> · `+
    `정답률 ${c.a.rate==null?"-":c.a.rate+"%"} → ${c.b.rate==null?"-":c.b.rate+"%"} ${arrow(c.b.rate, c.a.rate, true, 0, "%p")} · `+
    `평균 tok/s ${c.a.toks?c.a.toks.toFixed(1):"-"} → ${c.b.toks?c.b.toks.toFixed(1):"-"} ${arrow(c.b.toks, c.a.toks, true, 1)}</div>`;
  html += '<table class="q-table"><thead><tr><th>Q</th><th>자동 (기준→대상)</th><th>tok/s 변화</th><th>소요(s) 변화</th><th>토큰 변화</th></tr></thead><tbody>';
  for(const r of c.rows){
    const autoCls = r.b.auto==="✓" ? "up" : (r.b.auto==="✗" ? "down" : "flat");
    html += `<tr><td><b>${escapeHtml(r.id)}</b></td>
      <td><span class="flat">${escapeHtml(r.a.auto)}</span> → <b class="${autoCls}">${escapeHtml(r.b.auto)}</b></td>
      <td>${arrow(r.b.toks, r.a.toks, true, 1)}</td>
      <td>${arrow(r.b.elapsed, r.a.elapsed, false, 1)}</td>
      <td>${arrow(r.b.tokens, r.a.tokens, false, 0)}</td></tr>`;
  }
  return html + '</tbody></table>';
}

// ---- 전체 대화 Markdown 통합 내보내기 ----
function allConversationsToMarkdown(){
  let md = `# 전체 대화 통합 문서\n\n> ${store.conversations.length}개 대화 · ${new Date().toLocaleString("ko-KR")}\n\n---\n\n`;
  md += store.conversations.map(c=>conversationToMarkdown(c)).join("\n\n---\n\n");
  return md + "\n";
}

// ---- 전역 단축키 & 버튼 이벤트 배선 ----
function wireEnhancements(){
  renderShortcuts();

  // 헤더/사이드바 버튼
  $("searchBtn").addEventListener("click", ()=>{ if($("searchBar").classList.contains("open")) closeSearch(); else openSearch(); });
  $("favBtn").addEventListener("click", ()=>{ const p=$("favPanel"); if(p.classList.contains("open")){ p.classList.remove("open"); } else { renderFavPanel(); p.classList.add("open"); } });
  $("favCloseBtn").addEventListener("click", ()=>$("favPanel").classList.remove("open"));
  $("searchClose").addEventListener("click", closeSearch);
  $("searchNext").addEventListener("click", ()=>navSearch(1));
  $("searchPrev").addEventListener("click", ()=>navSearch(-1));
  $("searchInput").addEventListener("input", e=>doSearch(e.target.value));
  $("searchInput").addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); navSearch(e.shiftKey?-1:1); }
    else if(e.key==="Escape"){ e.preventDefault(); closeSearch(); }
  });
  $("shortcutBtn").addEventListener("click", ()=>{ renderShortcuts(); $("shortcutModal").classList.add("open"); });
  $("shortcutClose").addEventListener("click", ()=>$("shortcutModal").classList.remove("open"));
  $("shortcutModal").addEventListener("click", e=>{ if(e.target===$("shortcutModal")) $("shortcutModal").classList.remove("open"); });

  // 내보내기 팝업
  $("exportBtn").replaceWith($("exportBtn").cloneNode(true)); // 기존 리스너 제거
  $("exportBtn").addEventListener("click", e=>{
    e.stopPropagation();
    const existing = document.getElementById("exportPop"); if(existing){ existing.remove(); return; }
    const c = activeConv();
    const pop = document.createElement("div"); pop.id="exportPop"; pop.className="regen-model-pop open";
    pop.style.position="fixed"; pop.style.top="58px"; pop.style.right="60px"; pop.style.bottom="auto"; pop.style.left="auto";
    pop.innerHTML = `<button data-x="html">🌐 이 대화 (HTML)</button><button data-x="md">📝 이 대화 (Markdown)</button><button data-x="json">📥 이 대화 (JSON)</button><button data-x="print">🖨 인쇄 / PDF</button><button data-x="allmd">📚 전체 대화 (Markdown 통합)</button><button data-x="all">🗃️ 전체 대화 백업 (JSON)</button><button data-x="import">📤 백업 가져오기 (JSON)</button>`;
    pop.querySelectorAll("button").forEach(b=>b.addEventListener("click", ev=>{
      ev.stopPropagation(); pop.remove(); const x=b.dataset.x;
      if(x==="import"){ pickImportFile(); return; }
      if(x==="all"){ downloadFile("all_chats_"+dateStr()+".json", JSON.stringify(store.conversations,null,2), "application/json"); return; }
      if(x==="allmd"){ downloadFile("all_chats_"+dateStr()+".md", allConversationsToMarkdown(), "text/markdown"); return; }
      if(!c || !c.messages.length){ toastMsg("내보낼 대화가 없어요"); return; }
      if(x==="html") downloadFile("chat_"+dateStr()+".html", conversationToHTML(c), "text/html;charset=utf-8");
      else if(x==="md") downloadFile("chat_"+dateStr()+".md", conversationToMarkdown(c), "text/markdown");
      else if(x==="print") printConversation(c);
      else downloadFile("chat_"+dateStr()+".json", JSON.stringify(c.messages,null,2), "application/json");
    }));
    document.body.appendChild(pop);
    setTimeout(()=>{ const h=ev=>{ if(!pop.contains(ev.target)){ pop.remove(); document.removeEventListener("click",h,true); } }; document.addEventListener("click",h,true); },0);
  });

  // 드래그&드롭
  window.addEventListener("dragenter", e=>{
    if(!e.dataTransfer || !Array.from(e.dataTransfer.types||[]).includes("Files")) return;
    e.preventDefault(); dragDepth++; $("dropOverlay").classList.add("show");
  });
  window.addEventListener("dragover", e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files")) e.preventDefault(); });
  window.addEventListener("dragleave", e=>{ dragDepth = Math.max(0, dragDepth-1); if(dragDepth===0) $("dropOverlay").classList.remove("show"); });
  window.addEventListener("drop", async e=>{
    if(!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault(); dragDepth=0; $("dropOverlay").classList.remove("show");
    await handleDroppedFiles(Array.from(e.dataTransfer.files));
  });

  // 질문 뱅크
  $("qbankBtn").addEventListener("click", async ()=>{
    if($("qbankModal").classList.contains("open")){ closeQbank(); return; }
    openQbank();
    await loadQuestionBank();
    renderQbankCats(qbankAll());
    renderQbankStars(qbankAll());
    renderQbankList();
  });
  $("qbankClose").addEventListener("click", closeQbank);
  $("qbankModal").addEventListener("click", e=>{ if(e.target===$("qbankModal")) closeQbank(); });
  document.querySelectorAll(".qbank-tabs button").forEach(b=>b.addEventListener("click", ()=>qbankTab(b.dataset.tab)));
  $("qbankSearch").addEventListener("input", renderQbankList);
  $("qbankRandom").addEventListener("click", qbankRandom);
  $("qbankSort").addEventListener("change", renderQbankList);
  $("qbankAddBtn").addEventListener("click", ()=>{
    const f = $("qbankCustomForm");
    if(f.hidden) openCustomForm(); else closeCustomForm();
  });
  $("qbankCustomSave").addEventListener("click", saveCustomQuestion);
  $("qbankCustomCancel").addEventListener("click", closeCustomForm);
  $("qbankSelAll").addEventListener("click", ()=>{ qbankAll().forEach(x=>QSEL.add(x.id)); renderQbankList(); updateQselCount(); });
  $("qbankSelNone").addEventListener("click", ()=>{ QSEL.clear(); renderQbankList(); updateQselCount(); });
  $("qbankRunBtn").addEventListener("click", runSelectedQuestions);

  // 전역 키보드 단축키
  document.addEventListener("keydown", e=>{
    const ctrl = e.ctrlKey||e.metaKey;
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""));
    if(ctrl && e.key && e.key.toLowerCase()==="k"){ e.preventDefault(); if($("searchBar").classList.contains("open")) closeSearch(); else openSearch(); return; }
    if(ctrl && e.key && e.key.toLowerCase()==="b"){ e.preventDefault(); $("qbankBtn").click(); return; }
    if(ctrl && e.key && e.key.toLowerCase()==="n"){ e.preventDefault(); if(!sending) $("newChatBtn").click(); return; }
    if(ctrl && e.key==="/"){ e.preventDefault(); $("shortcutModal").classList.add("open"); return; }
    if(e.key==="Escape"){
      if($("qbankModal").classList.contains("open")){ closeQbank(); e.preventDefault(); return; }
      if(!$("settingsPop").hidden){ toggleSettings(false); e.preventDefault(); return; }
      if($("shortcutModal").classList.contains("open")){ $("shortcutModal").classList.remove("open"); e.preventDefault(); return; }
      if($("searchBar").classList.contains("open")){ closeSearch(); e.preventDefault(); return; }
      if($("favPanel").classList.contains("open")){ $("favPanel").classList.remove("open"); e.preventDefault(); return; }
      const ep=document.getElementById("exportPop"); if(ep){ ep.remove(); e.preventDefault(); return; }
    }
    if(inField) return;
  });
}
