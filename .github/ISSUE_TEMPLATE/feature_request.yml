name: ✨ 기능 제안
description: 새 기능이나 개선 아이디어를 제안해 주세요
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 기능이 필요한가요?
      description: 해결하려는 문제나 상황을 함께 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결 방법
      description: 가능한 구체적으로 적어 주세요.
  - type: textarea
    id: alternatives
    attributes:
      label: 다른 방법을 생각해 본 게 있나요?
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 채팅 UI / 스트리밍
        - 문서 첨부 (PDF/엑셀)
        - 질문 뱅크 / 채점표
        - 모델 로딩 / 성능
        - 설치 / 문서
        - 기타
    validations:
      required: true
